<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection check — Quiz Arena</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .check-row { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); align-items: start; }
  .check-row:last-child { border-bottom: none; }
  .dot { width: 20px; height: 20px; border-radius: 50%; margin-top: 2px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--sunk); }
  .dot.go { background: var(--jade); }
  .dot.no { background: var(--rose); }
  .dot.wait { background: var(--gold); }
  .check-row h3 { margin-bottom: 2px; }
  .check-row .detail { font-size: var(--step--1); color: var(--mute); }
  .check-row .hint { margin-top: 7px; padding: 9px 12px; border-radius: var(--r-md); background: var(--gold-soft); color: #7d5905; font-size: var(--step--1); }
  .check-row code { font-family: ui-monospace, Menlo, monospace; font-size: 0.85em; background: var(--sunk); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<main class="home" style="padding-top:6vh">
  <h1 class="home-title" style="font-size:clamp(2rem,5vw,3.2rem)">Connection check</h1>
  <p class="home-lede">Each step below runs in order. The first red one is the thing to fix.</p>

  <div class="panel">
    <div id="checks"></div>
  </div>

  <div id="actions" class="row wrap" style="margin-top:18px"></div>

  <div class="panel" style="margin-top:18px">
    <div class="panel-head"><h3>Full log</h3></div>
    <textarea id="log" readonly style="min-height:150px"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="copy-log">Copy the log</button>
      <a class="btn" href="index.html">Back to the start</a>
    </div>
  </div>
</main>
<script type="module" src="js/diagnose.js"></script>
</body>
</html>
